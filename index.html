<section id="s-dash" class="sec"><div class="wrap"><h2>Phân tích dữ liệu học tập</h2><p>Số liệu lấy từ các bài đã làm, lưu ngay trên trình duyệt này, không gửi đi đâu.</p><div id="dash"></div><div class="bar"><button class="btn" data-clr>Xóa dữ liệu học tập</button></div></div></section>
<script>
/* ===== Tiện ích ===== */
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const nz=(a,b)=>{let x=0;while(!x)x=ri(a,b);return x};
const tm=(n,v)=>n===0?"":(n<0?"− ":"+ ")+((Math.abs(n)===1&&v)?"":Math.abs(n))+v;
const lead=(n,v)=>(n<0?"−":"")+(Math.abs(n)===1?"":Math.abs(n))+v;
const fact=n=>n<2?1:n*fact(n-1),comb=(n,k)=>fact(n)/(fact(k)*fact(n-k)),per=(n,k)=>fact(n)/fact(n-k);
const fm=a=>String(a).replace(".",",");
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ===== Nội dung: mỗi câu trắc nghiệm = [đề, [đáp án đúng, sai, sai, sai], giải thích, mục kiến thức]
   Mỗi bài ứng dụng = [đề, đáp số, [các bước], mục kiến thức, cách hiển thị đáp số (tùy chọn)] ===== */
const T=[
/* 0 */{n:"Mệnh đề và tập hợp",
note:"Phủ định của “∀x, P(x)” là “∃x, không P(x)” và ngược lại. Mệnh đề kéo theo “P ⇒ Q” chỉ sai khi P đúng và Q sai; mệnh đề đảo của nó là “Q ⇒ P” (có thể sai dù mệnh đề ban đầu đúng). Với tập hợp: A∩B (giao), A∪B (hợp), A∖B (hiệu). Một tập hợp có n phần tử thì có 2ⁿ tập con. Lỗi hay gặp: quên rằng khi phủ định phải đổi cả lượng từ lẫn dấu bất đẳng thức.",
th:[
{k:"Giao, hợp, hiệu của các tập hợp",d:"A∩B gồm phần tử thuộc cả A và B; A∪B gồm phần tử thuộc A hoặc B; A∖B gồm phần tử thuộc A mà không thuộc B. Công thức đếm: n(A∪B) = n(A) + n(B) − n(A∩B). Ví dụ: A = {1; 2; 3}, B = {2; 3; 4} thì A∩B = {2; 3}, A∪B = {1; 2; 3; 4}, A∖B = {1}."},
{k:"Mệnh đề, phủ định, kéo theo",d:"Mệnh đề là câu khẳng định đúng hoặc sai. Phủ định của “∀x, P(x)” là “∃x, không P(x)”. “P ⇒ Q” sai duy nhất khi P đúng, Q sai. Để chứng tỏ một mệnh đề “∀” sai, chỉ cần một phản ví dụ. Ví dụ: “Nếu a chia hết cho 3 thì a chia hết cho 6” sai vì a = 3."},
{k:"Khoảng, đoạn, nửa khoảng",d:"Ngoặc tròn: không lấy đầu mút; ngoặc vuông: lấy đầu mút. Vẽ cả hai tập lên trục số rồi lấy phần chung (giao) hoặc phần phủ (hợp). Ví dụ: [1; 5) ∩ (2; 7] = (2; 5); (−∞; 3] ∪ (1; +∞) = ℝ."}],
q:[
["Cho A = {1; 2; 3; 4} và B = {3; 4; 5}. Tập A∩B là:",["{3; 4}","{1; 2; 3; 4; 5}","{1; 2}","{5}"],"A∩B gồm các phần tử chung của A và B là 3 và 4.",0],
["Với A = {1; 2; 3; 4} và B = {3; 4; 5}, tập A∖B là:",["{1; 2}","{5}","{3; 4}","{1; 2; 5}"],"A∖B gồm phần tử thuộc A mà không thuộc B: đó là 1 và 2.",0],
["Cho n(A) = 12, n(B) = 9 và n(A∩B) = 4. Khi đó n(A∪B) bằng:",["17","21","25","13"],"n(A∪B) = 12 + 9 − 4 = 17.",0],
["Tập hợp A có 4 phần tử. Số tập con của A là:",["16","8","4","10"],"Tập hợp n phần tử có 2ⁿ tập con: 2⁴ = 16.",0],
["Phủ định của mệnh đề “∀x∈ℝ, x² ≥ 0” là:",["∃x∈ℝ, x² < 0","∀x∈ℝ, x² < 0","∃x∈ℝ, x² ≤ 0","∀x∈ℝ, x² ≤ 0"],"Đổi ∀ thành ∃ và phủ định bất đẳng thức: x² ≥ 0 thành x² < 0.",1],
["Mệnh đề nào sau đây là mệnh đề sai?",["Nếu a chia hết cho 3 thì a chia hết cho 6","Nếu a chia hết cho 6 thì a chia hết cho 3","∃x∈ℝ, x² = 4","∀x∈ℝ, x² + 1 > 0"],"Phản ví dụ cho mệnh đề đầu: a = 3 chia hết cho 3 nhưng không chia hết cho 6. Ba mệnh đề còn lại đều đúng.",1],
["Cho A = [1; 5) và B = (2; 7]. Tập A∩B là:",["(2; 5)","[1; 7]","(2; 5]","[1; 2]"],"Phần chung nằm giữa 2 và 5. Tại 2: B không lấy; tại 5: A không lấy; nên được (2; 5).",2],
["Cho A = (−∞; 3] và B = (1; +∞). Tập A∪B là:",["ℝ","(1; 3]","(−∞; 1)","[3; +∞)"],"Mọi số thực hoặc ≤ 3 hoặc > 1 nên hợp của hai tập là toàn bộ ℝ.",2],
["Cho A = [−2; 3] và B = (0; 5]. Tập A∖B là:",["[−2; 0]","[−2; 0)","(3; 5]","[−2; 0) ∪ (3; 5]"],"Các số của A không thuộc B là các số ≤ 0. Số 0 không thuộc B (vì B là (0; 5]) nên 0 thuộc A∖B. Vậy A∖B = [−2; 0].",2]],
app:[
["Khảo sát 100 học sinh về thiết bị học tập: 70 em dùng điện thoại, 45 em dùng máy tính, 20 em dùng cả hai. Có bao nhiêu em không dùng thiết bị nào trong hai loại trên?",5,["Số em dùng ít nhất một loại: n(A∪B) = 70 + 45 − 20 = 95.","Số em không dùng loại nào: 100 − 95 = 5."],0],
["Một cảm biến chỉ ghi nhận mẫu hợp lệ khi nhiệt độ T ∈ [20; 35] và độ ẩm H ∈ (40; 80]. Mẫu đo có T = 35 và H = 40 có hợp lệ không? Nhập 1 nếu có, 0 nếu không.",0,["T = 35 thuộc [20; 35] vì đoạn lấy đầu mút 35.","H = 40 không thuộc (40; 80] vì khoảng không lấy đầu mút 40.","Điều kiện chung không thỏa nên mẫu không hợp lệ."],2]]},
/* 1 */{n:"Bất phương trình bậc nhất hai ẩn",
note:"Miền nghiệm của ax + by ≤ c là một nửa mặt phẳng bờ là đường thẳng ax + by = c. Để biết lấy nửa nào, thay tọa độ một điểm không nằm trên bờ (thường là gốc O) vào bất phương trình: đúng thì nửa mặt phẳng chứa điểm đó là miền nghiệm. Dấu < hoặc > thì không kể bờ; dấu ≤ hoặc ≥ thì kể cả bờ. Bài toán tối ưu: giá trị lớn nhất, nhỏ nhất của F = ax + by trên miền đa giác luôn đạt tại một đỉnh của miền.",
th:[
{k:"Nghiệm của bất phương trình",d:"Cặp (x₀; y₀) là nghiệm của ax + by ≤ c nếu ax₀ + by₀ ≤ c. Ví dụ: (1; 2) là nghiệm của x + y ≤ 4 vì 1 + 2 = 3 ≤ 4."},
{k:"Miền nghiệm của một bất phương trình",d:"Vẽ đường thẳng ax + by = c, lấy điểm thử (thường là O) để chọn nửa mặt phẳng. Ví dụ: 2x − y > 1: thay O được 0 > 1 sai, nên miền nghiệm là nửa mặt phẳng không chứa O, không kể bờ."},
{k:"Hệ bất phương trình và bài toán tối ưu",d:"Miền nghiệm của hệ là phần chung các nửa mặt phẳng. Để tìm giá trị lớn nhất, nhỏ nhất của F = ax + by: xác định các đỉnh của miền, tính F tại từng đỉnh rồi so sánh. Ví dụ: x ≥ 0, y ≥ 0, x + y ≤ k cho tam giác vuông cạnh k, diện tích k²/2."}],
q:[
["Cặp số nào là nghiệm của bất phương trình 2x + y < 3?",["(0; 0)","(2; 1)","(1; 2)","(3; 0)"],"Thay (0; 0): 0 < 3 đúng. Các cặp còn lại cho 5, 4, 6, đều không nhỏ hơn 3.",0],
["Cặp số nào là nghiệm của bất phương trình x − 2y > 3?",["(5; 0)","(3; 0)","(0; 0)","(1; 1)"],"(5; 0): 5 > 3 đúng. (3; 0) cho 3 > 3 sai; (0; 0) cho 0 > 3 sai; (1; 1) cho −1 > 3 sai.",0],
["Miền nghiệm của bất phương trình x + y ≤ 2 là:",["Nửa mặt phẳng bờ x + y = 2, chứa gốc O, kể cả bờ","Nửa mặt phẳng bờ x + y = 2, không chứa gốc O, kể cả bờ","Nửa mặt phẳng bờ x + y = 2, chứa gốc O, không kể bờ","Nửa mặt phẳng bờ x + y = 2, không chứa gốc O, không kể bờ"],"Thay O(0; 0): 0 ≤ 2 đúng nên lấy nửa chứa O. Dấu ≤ nên kể cả bờ.",1],
["Miền nghiệm của bất phương trình 2x − y > 1 là nửa mặt phẳng bờ 2x − y = 1 và:",["không kể bờ, không chứa gốc O","kể cả bờ, không chứa gốc O","không kể bờ, chứa gốc O","kể cả bờ, chứa gốc O"],"Thay O(0; 0): 0 > 1 sai nên không lấy nửa chứa O. Dấu > nên không kể bờ.",1],
["Điểm nào sau đây KHÔNG thuộc miền nghiệm của bất phương trình x + 2y ≤ 4?",["(3; 2)","(0; 0)","(2; 1)","(4; 0)"],"(3; 2): 3 + 4 = 7 > 4 nên không thuộc. Các điểm còn lại cho 0, 4, 4 đều ≤ 4.",1],
["Miền nghiệm của hệ x ≥ 0, y ≥ 0, x + y ≤ 1 là:",["Tam giác","Hình chữ nhật","Nửa mặt phẳng","Hình tròn"],"Đó là tam giác có ba đỉnh O(0; 0), (1; 0), (0; 1).",2],
["Cho F = x + y trên miền tam giác OAB có O(0; 0), A(4; 0), B(0; 3). Giá trị lớn nhất của F là:",["4","3","7","0"],"Giá trị lớn nhất đạt tại đỉnh: F(O) = 0, F(A) = 4, F(B) = 3. Lớn nhất là 4.",2],
["Cho F = 2x + 3y trên miền có các đỉnh O(0; 0), A(3; 0), B(2; 2), C(0; 4). Giá trị lớn nhất của F là:",["12","10","6","16"],"F(O) = 0, F(A) = 6, F(B) = 10, F(C) = 12. Lớn nhất là 12.",2]],
app:[
["Xưởng sản xuất hai loại sản phẩm X và Y. Mỗi sản phẩm X lãi 3 triệu đồng, mỗi sản phẩm Y lãi 2 triệu đồng. Gọi x, y là số sản phẩm mỗi loại trong ngày, ràng buộc: x + y ≤ 6, x ≤ 4, x ≥ 0, y ≥ 0. Tìm lợi nhuận lớn nhất F = 3x + 2y (triệu đồng).",16,["Các đỉnh của miền: (0; 0), (4; 0), (4; 2), (0; 6).","F lần lượt bằng 0, 12, 16, 12.","Lợi nhuận lớn nhất là 16 triệu đồng, đạt tại (4; 2)."],2],
["Robot chỉ hoạt động an toàn trong miền x ≥ 0, y ≥ 0, x + 2y ≤ 10 (đơn vị mét). Tính diện tích miền an toàn (m²).",25,["Miền là tam giác vuông với các đỉnh O(0; 0), (10; 0), (0; 5).","S = ½·10·5 = 25 m²."],2]]},
/* 2 */{n:"Hàm số bậc hai",
note:"Hàm số y = ax² + bx + c (a ≠ 0) có đồ thị là parabol, đỉnh I(−b/2a ; −Δ/4a) với Δ = b² − 4ac, trục đối xứng x = −b/2a. Nếu a > 0: nghịch biến trên (−∞; −b/2a), đồng biến trên (−b/2a; +∞), có giá trị nhỏ nhất tại đỉnh; nếu a < 0 thì ngược lại và có giá trị lớn nhất tại đỉnh. Số giao điểm với trục hoành phụ thuộc dấu của Δ.",
th:[
{k:"Đỉnh và trục đối xứng",d:"Parabol y = ax² + bx + c có trục đối xứng x = −b/2a và đỉnh I(−b/2a; y(−b/2a)). Ví dụ: y = x² − 6x + 5 có x = 3, y(3) = −4, đỉnh I(3; −4)."},
{k:"Biến thiên, giá trị lớn nhất và nhỏ nhất",d:"Nếu a > 0: giá trị nhỏ nhất đạt tại đỉnh, hàm nghịch biến bên trái đỉnh và đồng biến bên phải. Nếu a < 0: đạt giá trị lớn nhất tại đỉnh. Ví dụ: y = −x² + 6x − 5 có giá trị lớn nhất bằng 4 tại x = 3."},
{k:"Giao điểm với trục hoành và dấu tam thức",d:"Δ > 0: hai giao điểm; Δ = 0: một giao điểm (tiếp xúc); Δ < 0: không có. Nếu a > 0, f(x) < 0 chỉ khi x nằm giữa hai nghiệm. Ví dụ: x² − 5x + 6 < 0 khi 2 < x < 3."}],
q:[
["Đỉnh của parabol y = x² − 4x + 3 là:",["I(2; −1)","I(−2; −1)","I(2; 1)","I(4; 3)"],"x = −(−4)/(2·1) = 2; y = 4 − 8 + 3 = −1.",0],
["Trục đối xứng của parabol y = −2x² + 8x − 1 là đường thẳng:",["x = 2","x = −2","x = 4","x = −4"],"x = −b/2a = −8/(2·(−2)) = 2.",0],
["Hàm số y = x² − 4x + 3 đồng biến trên khoảng nào?",["(2; +∞)","(−∞; 2)","(−∞; −1)","(−1; +∞)"],"a = 1 > 0 và hoành độ đỉnh là 2, nên hàm số đồng biến trên (2; +∞).",1],
["Giá trị lớn nhất của hàm số y = −x² + 6x − 5 là:",["4","3","−5","9"],"a < 0, đỉnh x = 3, y(3) = −9 + 18 − 5 = 4.",1],
["Parabol y = x² − 2x − 3 cắt trục hoành tại các điểm có hoành độ:",["x = −1 và x = 3","x = 1 và x = −3","x = −1 và x = −3","x = 1 và x = 3"],"x² − 2x − 3 = (x + 1)(x − 3) = 0 nên x = −1 hoặc x = 3.",2],
["Hàm số bậc hai có đồ thị là parabol đỉnh I(1; 0), đi qua A(0; 1) là:",["y = x² − 2x + 1","y = x² + 2x + 1","y = −x² + 2x + 1","y = 2x² − 4x + 1"],"y = x² − 2x + 1 có đỉnh x = 1, y(1) = 0 và y(0) = 1. Các phương án khác có đỉnh sai.",0],
["Tam thức f(x) = x² − 5x + 6 nhận giá trị âm khi:",["x ∈ (2; 3)","x ∈ (−∞; 2) ∪ (3; +∞)","x ∈ [2; 3]","x ∈ (−3; −2)"],"f(x) = (x − 2)(x − 3), a > 0 nên f(x) < 0 khi x nằm giữa hai nghiệm 2 và 3.",2],
["Tìm m để parabol y = x² − 2x + m cắt trục hoành tại hai điểm phân biệt:",["m < 1","m > 1","m ≤ 1","m ≥ 1"],"Δ' = 1 − m > 0 nên m < 1.",2]],
app:[
["Rào một mảnh vườn hình chữ nhật bằng 40 m lưới, một cạnh dựa vào tường nên không cần rào. Gọi x (m) là độ dài mỗi cạnh vuông góc với tường, diện tích S = x(40 − 2x). Tìm diện tích lớn nhất (m²).",200,["S = −2x² + 40x, a < 0.","Đỉnh x = −40/(2·(−2)) = 10.","S(10) = 10·20 = 200 m²."],1],
["Quả bóng được ném lên có độ cao h(t) = −5t² + 20t + 1 (mét, t tính bằng giây). Tìm độ cao lớn nhất của quả bóng (m).",21,["a = −5 < 0 nên h đạt lớn nhất tại đỉnh.","t = −20/(2·(−5)) = 2.","h(2) = −20 + 40 + 1 = 21 m."],1]]},
/* 3 */{n:"Hệ thức lượng trong tam giác",
note:"Định lí côsin: a² = b² + c² − 2bc·cosA. Định lí sin: a/sinA = b/sinB = c/sinC = 2R. Diện tích: S = ½·bc·sinA = abc/4R = pr; công thức Heron: S = √(p(p−a)(p−b)(p−c)) với p là nửa chu vi. Độ dài trung tuyến: mₐ² = (2b² + 2c² − a²)/4. Giá trị cần nhớ: sin30° = ½, sin60° = √3/2, cos60° = ½, cos120° = −½.",
th:[
{k:"Định lí côsin",d:"a² = b² + c² − 2bc·cosA. Dùng khi biết hai cạnh và góc xen giữa, hoặc biết ba cạnh để tìm góc. Nếu a² > b² + c² thì góc A tù. Ví dụ: b = 3, c = 4, A = 60° thì a² = 9 + 16 − 12 = 13."},
{k:"Định lí sin và bán kính đường tròn ngoại tiếp",d:"a/sinA = b/sinB = c/sinC = 2R. Dùng khi biết một cạnh và các góc, hoặc cần tìm R. Ví dụ: a = 10, A = 30° thì 2R = 10/½ = 20 nên R = 10."},
{k:"Diện tích tam giác",d:"S = ½·bc·sinA = abc/4R = pr, hoặc công thức Heron. Ví dụ: b = 4, c = 6, A = 30° thì S = ½·4·6·½ = 6. Tam giác 13, 14, 15 có p = 21 và S = 84."},
{k:"Đường trung tuyến",d:"mₐ² = (2b² + 2c² − a²)/4 với mₐ là trung tuyến kẻ từ A. Ví dụ: a = 8, b = 6, c = 4 thì mₐ² = (72 + 32 − 64)/4 = 10."}],
q:[
["Tam giác ABC có b = 3, c = 5, góc A = 60°. Khi đó a² bằng:",["19","34","49","64"],"a² = 9 + 25 − 2·3·5·cos60° = 34 − 15 = 19.",0],
["Tam giác ABC có AB = 5, AC = 8, BC = 7. Số đo góc A là:",["60°","30°","45°","120°"],"cosA = (25 + 64 − 49)/(2·5·8) = 40/80 = ½ nên A = 60°.",0],
["Tam giác có ba cạnh 4, 5, 7 là tam giác:",["tù","nhọn","vuông","đều"],"Cạnh lớn nhất là 7: 7² = 49 > 4² + 5² = 41 nên góc đối diện cạnh 7 là góc tù.",0],
["Tam giác ABC có a = 10 và góc A = 30°. Bán kính đường tròn ngoại tiếp R bằng:",["10","5","20","15"],"R = a/(2·sinA) = 10/(2·½) = 10.",1],
["Tam giác ABC có góc A = 30°, góc B = 60° và a = 2. Cạnh b bằng:",["2√3","2","4","√3"],"b/sinB = a/sinA nên b = 2·(√3/2)/(½) = 2√3.",1],
["Bán kính đường tròn ngoại tiếp tam giác vuông có hai cạnh góc vuông 6 và 8 là:",["5","10","4,8","7"],"Cạnh huyền bằng 10, tâm đường tròn ngoại tiếp là trung điểm cạnh huyền nên R = 5.",1],
["Tam giác ABC có b = 4, c = 6, góc A = 30°. Diện tích bằng:",["6","12","3","6√3"],"S = ½·4·6·sin30° = 6.",2],
["Tam giác có ba cạnh 13, 14, 15. Diện tích bằng:",["84","42","168","90"],"p = 21. S = √(21·8·7·6) = √7056 = 84.",2],
["Tam giác có ba cạnh 13, 14, 15. Bán kính đường tròn nội tiếp r bằng:",["4","5","6","3"],"S = pr nên r = S/p = 84/21 = 4.",2],
["Tam giác ABC có AB = 4, AC = 6, BC = 8. Bình phương độ dài trung tuyến AM (M là trung điểm BC) bằng:",["10","20","25","13"],"AM² = (2·36 + 2·16 − 64)/4 = 40/4 = 10.",3]],
app:[
["Ba trạm quan trắc A, B, C cần một camera đặt tại tâm đường tròn đi qua cả ba trạm. Biết BC = 80 m và góc A = 30°. Khoảng cách R từ camera đến mỗi trạm là bao nhiêu mét?",80,["Định lí sin: BC/sinA = 2R.","R = 80/(2·sin30°) = 80/(2·½) = 80 m."],1],
["Hai tàu rời cảng cùng lúc theo hai hướng hợp nhau góc 60°. Tàu thứ nhất đi 30 km/h, tàu thứ hai đi 80 km/h. Sau 1 giờ, hai tàu cách nhau bao nhiêu km?",70,["Định lí côsin: d² = 30² + 80² − 2·30·80·cos60°.","d² = 900 + 6400 − 2400 = 4900.","d = 70 km."],0]]},
/* 4 */{n:"Vectơ",
note:"Nếu M là trung điểm của AB thì MA→ + MB→ = 0→. Quy tắc hình bình hành: AB→ + AD→ = AC→. Với a = (x₁; y₁), b = (x₂; y₂): a + b = (x₁ + x₂ ; y₁ + y₂), |a| = √(x₁² + y₁²), tích vô hướng a·b = x₁x₂ + y₁y₂. Hai vectơ vuông góc khi a·b = 0. Toạ độ AB→ = (xB − xA ; yB − yA), trung điểm I và trọng tâm G tính bằng trung bình cộng tọa độ.",
th:[
{k:"Vectơ và các phép toán",d:"Quy tắc ba điểm: AB→ + BC→ = AC→; quy tắc hình bình hành: AB→ + AD→ = AC→. Nếu G là trọng tâm tam giác ABC thì GA→ + GB→ + GC→ = 0→. Ví dụ: M là trung điểm AB thì MA→ + MB→ = 0→."},
{k:"Tọa độ vectơ, trung điểm, trọng tâm",d:"Với a = (x₁; y₁), b = (x₂; y₂): a + b = (x₁ + x₂; y₁ + y₂), ka = (kx₁; ky₁). AB→ = (xB − xA; yB − yA), AB = √((xB − xA)² + (yB − yA)²). Trọng tâm G = ((xA + xB + xC)/3 ; (yA + yB + yC)/3). Ví dụ: (1; 2) + (3; −1) = (4; 1)."},
{k:"Tích vô hướng và góc giữa hai vectơ",d:"a·b = x₁x₂ + y₁y₂ = |a||b|cos(a, b). Hai vectơ vuông góc khi a·b = 0. Ví dụ: (1; 2)·(3; −1) = 3 − 2 = 1; cos của góc giữa (1; 0) và (1; 1) bằng 1/√2 nên góc là 45°."}],
q:[
["Cho M là trung điểm của đoạn AB. Khẳng định nào đúng?",["MA→ + MB→ = 0→","MA→ = MB→","MA→ − MB→ = 0→","AB→ = BM→"],"MA→ và MB→ là hai vectơ đối nhau nên tổng bằng 0→.",0],
["Cho hình bình hành ABCD. Khẳng định nào đúng?",["AB→ + AD→ = AC→","AB→ + AD→ = BD→","AB→ + AD→ = CA→","AB→ + AD→ = 0→"],"Theo quy tắc hình bình hành, AB→ + AD→ = AC→.",0],
["Cho a = (1; 2) và b = (3; −1). Tọa độ của a + b là:",["(4; 1)","(2; 3)","(4; −1)","(3; −2)"],"Cộng từng tọa độ: (1 + 3 ; 2 + (−1)) = (4; 1).",1],
["Cho A(1; 2) và B(4; 6). Độ dài đoạn AB bằng:",["5","7","25","√7"],"AB→ = (3; 4) nên AB = √(9 + 16) = 5.",1],
["Trung điểm I của đoạn AB với A(2; −1), B(4; 5) có tọa độ:",["(3; 2)","(6; 4)","(1; 3)","(3; 3)"],"I = ((2 + 4)/2 ; (−1 + 5)/2) = (3; 2).",1],
["Tam giác ABC có A(1; 2), B(3; −1), C(5; 5). Trọng tâm G có tọa độ:",["(3; 2)","(9; 6)","(2; 1)","(3; 3)"],"x = (1 + 3 + 5)/3 = 3; y = (2 − 1 + 5)/3 = 2.",1],
["Cho a = (1; 2) và b = (3; −1). Tích vô hướng a·b bằng:",["1","5","−1","0"],"a·b = 1·3 + 2·(−1) = 1.",2],
["Cho a = (2; −3) và b = (m; 4). Giá trị m để a ⊥ b là:",["6","−6","3","−3"],"a·b = 2m − 12 = 0 nên m = 6.",2],
["Góc giữa hai vectơ a = (1; 0) và b = (1; 1) bằng:",["45°","30°","60°","90°"],"cos(a, b) = 1/(1·√2) = √2/2 nên góc bằng 45°.",2]],
app:[
["Máy bay không người lái bay thẳng từ A(2; 1) đến B(8; 9) trên mặt phẳng tọa độ (đơn vị km). Tính quãng đường AB (km).",10,["AB→ = (6; 8).","AB = √(36 + 64) = 10 km."],1],
["Một lực F = (3; 4) (N) làm vật dịch chuyển theo vectơ d = (5; 2) (m). Công của lực là A = F·d. Tính A (J).",23,["A = 3·5 + 4·2.","A = 15 + 8 = 23 J."],2]]},
/* 5 */{n:"Phương pháp tọa độ trong mặt phẳng",
note:"Đường thẳng qua M(x₀; y₀) có vectơ pháp tuyến n = (a; b): a(x − x₀) + b(y − y₀) = 0. Vectơ chỉ phương u = (−b; a). Khoảng cách từ M đến d: ax + by + c = 0 là |ax₀ + by₀ + c|/√(a² + b²). Hai đường thẳng vuông góc khi aa' + bb' = 0. Đường tròn tâm I(a; b), bán kính R: (x − a)² + (y − b)² = R², dạng khai triển x² + y² − 2ax − 2by + c = 0 với R² = a² + b² − c.",
th:[
{k:"Phương trình đường thẳng",d:"Qua M(x₀; y₀), vectơ pháp tuyến (a; b): a(x − x₀) + b(y − y₀) = 0. Phương trình tham số: x = x₀ + at, y = y₀ + bt với (a; b) là vectơ chỉ phương. Ví dụ: qua A(1; 2), n = (2; −1) thì 2(x − 1) − (y − 2) = 0, tức 2x − y = 0."},
{k:"Vị trí tương đối và khoảng cách",d:"d: ax + by + c = 0 và d': a'x + b'y + c' = 0 vuông góc khi aa' + bb' = 0; song song khi hệ số tỉ lệ nhưng hằng số không tỉ lệ. Khoảng cách từ M(x₀; y₀) đến d là |ax₀ + by₀ + c|/√(a² + b²). Ví dụ: d(O; 3x + 4y − 10 = 0) = 10/5 = 2."},
{k:"Đường tròn",d:"Tâm I(a; b), bán kính R: (x − a)² + (y − b)² = R². Nếu đường tròn đi qua A thì R = IA. Đường thẳng tiếp xúc đường tròn khi d(I; Δ) = R. Ví dụ: I(0; 0), A(3; 4) thì R = √(9 + 16) = 5."}],
q:[
["Khoảng cách từ M(1; 2) đến đường thẳng 3x + 4y − 3 = 0 là:",["8/5","2","4/5","12/5"],"|3·1 + 4·2 − 3|/√(9 + 16) = 8/5.",1],
["Hai đường thẳng 2x − y + 1 = 0 và 4x − 2y + 5 = 0:",["song song","trùng nhau","cắt nhau và vuông góc","cắt nhau nhưng không vuông góc"],"Hệ số của x, y tỉ lệ 2/4 = −1/−2 nhưng hằng số 1/5 không cùng tỉ lệ nên hai đường thẳng song song.",1],
["Hai đường thẳng x + y − 1 = 0 và x − y + 3 = 0:",["vuông góc","song song","trùng nhau","cắt nhau nhưng không vuông góc"],"Tích vô hướng hai vectơ pháp tuyến: 1·1 + 1·(−1) = 0 nên vuông góc.",1],
["Đường thẳng qua A(1; 2) và có vectơ pháp tuyến n = (2; −1) có phương trình:",["2x − y = 0","2x − y + 4 = 0","x + 2y − 5 = 0","x − 2y + 3 = 0"],"2(x − 1) − (y − 2) = 0, rút gọn được 2x − y = 0.",0],
["Đường thẳng đi qua A(1; 1) và B(3; 5) có phương trình:",["2x − y − 1 = 0","2x + y − 3 = 0","x − 2y + 1 = 0","2x − y + 1 = 0"],"AB→ = (2; 4) nên có vectơ pháp tuyến (2; −1): 2(x − 1) − (y − 1) = 0, tức 2x − y − 1 = 0. Kiểm tra B: 6 − 5 − 1 = 0.",0],

/* 6 */{n:"Đại số tổ hợp",
note:"Quy tắc cộng: các cách chọn loại trừ nhau thì cộng. Quy tắc nhân: các việc liên tiếp thì nhân. Hoán vị n phần tử: n!. Chỉnh hợp chập k (có thứ tự): A(n,k) = n!/(n−k)!. Tổ hợp chập k (không quan tâm thứ tự): C(n,k) = n!/(k!(n−k)!). Nhị thức Newton: (a + b)ⁿ = ΣC(n,k)·aⁿ⁻ᵏ·bᵏ. Mẹo: hỏi “có phân biệt thứ tự không?” để chọn giữa chỉnh hợp và tổ hợp.",
th:[
{k:"Quy tắc cộng và quy tắc nhân",d:"Việc làm xong bằng một trong các phương án loại trừ nhau: cộng số cách. Việc gồm nhiều bước liên tiếp: nhân số cách. Ví dụ: 3 áo và 4 quần cho 3·4 = 12 bộ; chọn 1 bạn từ 20 nam hoặc 15 nữ có 20 + 15 = 35 cách."},
{k:"Hoán vị, chỉnh hợp, tổ hợp",d:"Xếp n phần tử thành hàng: n! cách. Chọn k phần tử có thứ tự: A(n,k) = n!/(n−k)!. Chọn k phần tử không thứ tự: C(n,k) = n!/(k!(n−k)!). Ví dụ: C(5,2) = 10; A(5,3) = 60; hai bạn luôn đứng cạnh nhau trong hàng 6 bạn: 2·5! = 240 cách."},
{k:"Nhị thức Newton",d:"(a + b)ⁿ = C(n,0)aⁿ + C(n,1)aⁿ⁻¹b + … + C(n,n)bⁿ. Ví dụ: (x + 2)³ = x³ + 6x² + 12x + 8; hệ số của x² trong (1 + x)⁴ là C(4,2) = 6."}],
q:[
["Có bao nhiêu cách chọn 2 người từ nhóm 5 người (không phân biệt thứ tự)?",["10","20","5","25"],"C(5,2) = 5!/(2!·3!) = 10.",1],

/* 7 */{n:"Xác suất",
note:"Với phép thử có các kết quả đồng khả năng: P(A) = n(A)/n(Ω), trong đó n(A) là số kết quả thuận lợi cho A, n(Ω) là số kết quả có thể; 0 ≤ P(A) ≤ 1. Biến cố đối: P(Ā) = 1 − P(A). Hai biến cố xung khắc (không thể xảy ra đồng thời) thì P(A∪B) = P(A) + P(B). Khi chọn vật từ một nhóm, đếm bằng tổ hợp để tính n(Ω) và n(A).",
th:[
{k:"Xác suất cổ điển",d:"P(A) = n(A)/n(Ω) khi các kết quả đồng khả năng. Gieo hai xúc xắc có n(Ω) = 36. Ví dụ: gieo xúc xắc, xác suất ra số chấm lẻ là 3/6 = ½; tổng hai xúc xắc bằng 7 có 6 kết quả nên xác suất 6/36 = 1/6."},
{k:"Biến cố đối và biến cố xung khắc",d:"P(Ā) = 1 − P(A). A và B xung khắc khi A∩B = ∅, khi đó P(A∪B) = P(A) + P(B). Ví dụ: bắn trúng với xác suất 0,7 thì không trúng với xác suất 0,3."},
{k:"Chọn vật bằng tổ hợp",d:"Chọn k vật từ n vật: n(Ω) = C(n,k). Số cách chọn thuận lợi tính bằng tổ hợp hoặc quy tắc đếm. Ví dụ: hộp 3 bi đỏ, 2 bi xanh, lấy 2 bi: P(hai bi cùng màu) = (C(3,2) + C(2,2))/C(5,2) = 4/10."}],
q:[

["Gieo hai con xúc xắc cân đối. Xác suất để tổng số chấm khác 12 là:",["35/36","1/36","11/12","5/6"],"Tổng bằng 12 chỉ có (6;6) nên xác suất 1/36; biến cố đối có xác suất 1 − 1/36 = 35/36.",1],

/* 8 */{n:"Số đặc trưng của mẫu số liệu",
note:"Số trung bình x̄ = tổng các giá trị / số giá trị. Trung vị: giá trị chính giữa khi sắp xếp tăng dần (số giá trị chẵn thì lấy trung bình hai số giữa). Mốt: giá trị xuất hiện nhiều nhất. Khoảng biến thiên R = max − min. Tứ phân vị: Q₂ là trung vị, Q₁ là trung vị nửa dưới, Q₃ là trung vị nửa trên; khoảng tứ phân vị ΔQ = Q₃ − Q₁. Phương sai s² = trung bình của (xᵢ − x̄)²; độ lệch chuẩn s = √s². Giá trị ngoại lệ: nhỏ hơn Q₁ − 1,5·ΔQ hoặc lớn hơn Q₃ + 1,5·ΔQ.",
th:[
{k:"Số trung bình, trung vị, mốt",d:"x̄ = (x₁ + … + xₙ)/n. Với bảng tần số: x̄ = (x₁f₁ + x₂f₂ + …)/n. Trung vị: sắp xếp tăng dần; n lẻ lấy giá trị giữa, n chẵn lấy trung bình hai giá trị giữa. Ví dụ: 1; 3; 5; 7 có trung vị 4."},
{k:"Phương sai và độ lệch chuẩn",d:"s² = trung bình của (xᵢ − x̄)²; s = √s². Phương sai và độ lệch chuẩn đo độ phân tán quanh trung bình. Cộng thêm cùng một số vào mọi giá trị thì x̄ tăng theo, còn s² không đổi. Ví dụ: 2; 4; 6 có x̄ = 4, s² = 8/3."},
{k:"Khoảng biến thiên, tứ phân vị, giá trị ngoại lệ",d:"R = max − min. Chia mẫu đã sắp xếp thành hai nửa: Q₁ là trung vị nửa dưới, Q₃ là trung vị nửa trên. ΔQ = Q₃ − Q₁. Ví dụ: mẫu 1; 2; 3; 4; 5; 6; 7; 8 có Q₁ = 2,5, Q₃ = 6,5, ΔQ = 4."}],

/* ===== Gia sư AI: chạy hoàn toàn trên trình duyệt, không gửi dữ liệu đi đâu =====
   1) Mô hình năng lực (theo dõi tri thức Bayes) cho từng mục kiến thức, có tính độ lâu chưa ôn
   2) Chẩn đoán kiểu sai từ đáp số học sinh nhập  3) Gợi ý 3 mức  4) Hỏi đáp tra cứu TF-IDF trên lý thuyết + máy tính
   Tùy chọn: đặt window.AI_ENDPOINT = "địa chỉ proxy LLM của bạn" để chuyển câu hỏi sang mô hình ngôn ngữ lớn. */
const AI=(()=>{
const fold=s=>String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d");
const tok=s=>{const w=fold(s).replace(/[^a-z0-9]+/g," ").trim().split(" ").filter(x=>x.length>1);return w.concat(w.slice(1).map((x,i)=>w[i]+"_"+x))};
const docs=[];T.forEach((t,i)=>{docs.push({i,t:-1,k:t.n,d:t.note});t.th.forEach((x,j)=>docs.push({i,t:j,k:x.k,d:x.d}))});
const df={};docs.forEach(o=>{o.v={};o.n=0;tok(T[o.i].n+" "+o.k+" "+o.k+" "+o.d).forEach(w=>{o.v[w]=(o.v[w]||0)+1;o.n++});Object.keys(o.v).forEach(w=>df[w]=(df[w]||0)+1)});
const idf=w=>Math.log(1+docs.length/df[w]);
const SW=new Set("cong thuc la gi khi nao dung cach tinh the nao cho toi hay giai thich bai ve co nhu sao muon biet vi du loi sai gap tai ky hon chi tiet nua them ban giup nhe nha".split(" "));
const find=q=>{const qs=tok(fold(q).replace(/[a-z0-9]+/g,w=>SY[w]||w)).filter(w=>!SW.has(w));return docs.map(o=>({o,s:qs.reduce((a,w)=>a+(o.v[w]?idf(w)*(1+Math.log(o.v[w])):0),0)/Math.sqrt(o.n)})).sort((a,b)=>b.s-a.s)};
const TH=0.5;
/* --- mô hình năng lực --- */
const M=()=>S.m=S.m||{};
function upd(i,t,ok){const r=M()[i+"-"+t]||(M()[i+"-"+t]={p:.3,n:0}),sl=.1,g=.22,l=.15;
const q=ok?r.p*(1-sl)/(r.p*(1-sl)+(1-r.p)*g):r.p*sl/(r.p*sl+(1-r.p)*(1-g));r.p=q+(1-q)*l;r.n++;r.d=Date.now();save()}
const w0=weak;weak=function(i,t,b){w0(i,t,b);upd(i,t,!b)};
const pri=()=>{const m=M(),now=Date.now(),o=[];T.forEach((tp,i)=>tp.th.forEach((x,t)=>{const r=m[i+"-"+t],p=r?r.p:.3,dy=r?(now-r.d)/864e5:0;o.push({i,t,k:x.k,tn:tp.n,p,n:r?r.n:0,s:(1-p)*(1+Math.min(dy,14)/14)})}));return o.sort((a,b)=>b.s-a.s)};
